name: Deploy Frame Studio to GitHub Pages

on:
  push:
    branches:
      - claude/relaxed-tesla-j0450w
    paths:
      - "frame-editor/**"
      - ".github/workflows/deploy-frame-studio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: frame-editor
        run: npm install
      - name: Build
        working-directory: frame-editor
        run: npx vite build --base=/olyanmintabitlife/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frame-editor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
